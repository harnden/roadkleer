<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoadKleer</title>
<meta name="description" content="Mark the spot. Kleer the road.">
<meta name="theme-color" content="#050705">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RoadKleer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050705'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23d4251c'/%3E%3Crect x='8' y='30' width='10' height='4' fill='%23e6ff2b'/%3E%3Crect x='46' y='30' width='10' height='4' fill='%23e6ff2b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{
  --bg:#050705; --text:#e6ff2b; --accent:#e6ff2b; --alarm:#d4251c;
  --muted:color-mix(in srgb,var(--text) 62%,var(--bg));
  --border:color-mix(in srgb,var(--text) 18%,var(--bg));
  --soft:color-mix(in srgb,var(--accent) 14%,var(--bg));
  --font:"Share Tech Mono","Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
  --size:15px; --h:28px; --radius:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#000;color:var(--text);font:var(--size)/1.45 var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:500px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:0 0 80px color-mix(in srgb,var(--text) 10%,transparent)}}
.app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}

.head{flex:none;display:flex;align-items:center;gap:8px;padding:14px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--border);font-size:16px}
.head .brand{font-weight:700;letter-spacing:.02em;text-shadow:0 0 10px color-mix(in srgb,var(--text) 40%,transparent)}
.head .back{border:none;background:none;font-size:24px;line-height:1;padding:0 6px 0 0;cursor:pointer}
.head .tag{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.head .hist{margin-left:auto;border:1px solid var(--border);background:none;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.head .hist + .tag{margin-left:10px}
.progress{height:3px;background:var(--border);flex:none}
.progress b{display:block;height:100%;background:var(--accent);box-shadow:0 0 8px var(--accent);transition:width .3s}

.body{flex:1;overflow-y:auto;padding:22px max(22px,env(safe-area-inset-right,0px)) 18px max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.body.center{align-items:center;justify-content:center;text-align:center}
h1{margin:0;font-size:var(--h);line-height:1.15;font-weight:700;text-wrap:balance;text-shadow:0 0 14px color-mix(in srgb,var(--text) 45%,transparent)}
p{margin:0;color:var(--muted)}
.lead{color:var(--text);font-size:1.05em}
.fine{font-size:.86em}
.kicker{letter-spacing:.14em;text-transform:uppercase;font-size:.82em}

.panic{position:relative;width:188px;height:188px;flex:none;margin-block:18px;border-radius:50%;border:none;background:var(--alarm);color:#fff;
  font-size:1.05em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 0 0 10px color-mix(in srgb,var(--alarm) 16%,transparent),0 0 0 22px color-mix(in srgb,var(--alarm) 7%,transparent),0 12px 30px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.25);
  transition:transform .12s}
.panic:active{transform:scale(.96)}
.panic::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--alarm);opacity:0;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.panic.busy{pointer-events:none}
.panic.busy::before{animation-duration:.9s}

.gps{font-size:.82em;color:var(--muted);display:flex;align-items:center;gap:8px}
.gps i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.gps.on i{background:#3dff6a;box-shadow:0 0 8px #3dff6a}
.gps.wait i{background:var(--accent);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;background:var(--bg);cursor:pointer;transition:border-color .12s,background .12s}
.opt .dot{width:16px;height:16px;flex:none;border:2px solid var(--border);border-radius:50%;display:grid;place-items:center}
.opt.multi .dot{border-radius:4px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--bg)}
.opt.multi[aria-pressed="true"] .dot::after{width:8px;height:4px;border-radius:0;background:none;border:2px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cta{flex:none;margin-top:auto;border:none;border-radius:999px;padding:15px 18px;background:var(--accent);color:var(--bg);font-weight:700;letter-spacing:.04em;cursor:pointer;width:100%;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.cta:disabled{opacity:.3;box-shadow:none;cursor:not-allowed}
.cta.busy{opacity:.7}
.ghost{border:1px dashed var(--border);background:none;color:var(--muted);border-radius:var(--radius);padding:11px 12px;font-size:.92em;cursor:pointer;width:100%}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.82em;line-height:1.4;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.receipt{width:100%;border:1px dashed var(--border);border-radius:var(--radius);padding:14px;font-size:12.5px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:5px 14px}
.receipt dt{color:var(--muted)}.receipt dd{margin:0;min-width:0;overflow-wrap:anywhere}
.receipt a{color:var(--text)}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:.92em}
.item .id{color:var(--muted);font-size:.85em}
.item .when{color:var(--muted);font-size:.85em;text-align:right}
.item a{color:var(--muted);font-size:.85em}
.empty{color:var(--muted);text-align:center;margin:auto 0}
.foot{flex:none;padding:12px 18px 14px;border-top:1px solid var(--border);font-size:.8em;color:var(--muted);text-align:center;line-height:1.4}
.toast{position:absolute;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85em;z-index:6;white-space:nowrap}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.screen{animation:in .22s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<script>
const C = {
 "appName": "RoadKleer",
 "screens": {
  "welcome": {
   "tag": "We all die eventually",
   "kicker": "Death Sucks",
   "title": "Kleer It",
   "button": "Tap here",
   "body": "RoadKleer uses GPS to mark the spot",
   "note": "(Errant takes make tax-dollar waste)",
   "footer": "Drive with RoadKleer ready for best results"
  },
  "animal": {
   "tag": "Grim",
   "title": "What got hit",
   "options": "Deer\nSquirrel \nTurtle\nRaccoon\nSkunk\nPossum\nPorcupine\nBird\n'Dillo\nNot sure\nMy feelgoods\nOther",
   "domestic": "Cats and dogs",
   "next": "Next",
   "footer": "Life's short, aint it?"
  },
  "condition": {
   "tag": "Grief is good",
   "title": "What condition its condition was in",
   "options": "Asunder\nMostly intact\nLimping\nTwitching\nMashed\nSmeared\nPrefer not to say",
   "next": "Next",
   "footer": "Lord grant us the strength to un-see some stuff"
  },
  "send": {
   "tag": "Ouch",
   "title": "Where would you like to send your report?",
   "sub": "Check all that apply.",
   "options": "Municipal services\nPolice & Fire\nWork-release inmates (if avail.)\nInto the void (+karma)",
   "next": "Next",
   "footer": "RoadKleer pretends to summon cleaning services "
  },
  "feeling": {
   "tag": "Breathe",
   "title": "How do you feel?",
   "sub": "(this part is for you)",
   "options": "Sad\nDevastated\nIndifferent\nAngry\nPhysically ill\nGuilty\nSelf-reflexively sad, angry, guilty or physically ill due to lack of human emotion such as the above\nLike maybe, in its own small way, using RoadKleer helped",
   "next": "Submit",
   "footer": "Consider your life affirmed"
  },
  "done": {
   "tag": "Good karma",
   "pill": "Report submitted",
   "title": "Thanks.",
   "body": "You're still here, keep going",
   "again": "Report another",
   "footer": "RoadKleer does not guarantee receipt  of reports"
  },
  "domestic": {
   "tag": "Domesticated Animals",
   "pill": "Pet?",
   "title": "We acknowledge how devastating it can be to lose a pal.",
   "body": "Pets are past our purr-view.",
   "back": "Home",
   "footer": "Rest best, kleered."
  }
 }
};
const S = C.screens;
const ORDER = ["animal","condition","send","feeling"];
const MULTI = {condition:true, send:true};   // multi-select screens keep a Next button
const OPTIONAL = {feeling:true};             // optional screens keep a button so they can be skipped
const HKEY = "roadkleer-reports";
const app = document.getElementById("app");

let screen = "welcome";
let picks, fix, gpsState = "idle";
function fresh(){ picks = {animal:null,condition:[],send:[],feeling:null}; fix = null; gpsState = "idle"; }
fresh();

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const txt = s => esc(s).replace(/\n/g,"<br>");
const lines = s => String(s).split("\n").map(x=>x.trim()).filter(Boolean);

function history(){ try{ return JSON.parse(localStorage.getItem(HKEY)) || []; }catch(e){ return []; } }
function keep(r){ try{ const h = history(); h.unshift(r); localStorage.setItem(HKEY, JSON.stringify(h.slice(0,50))); }catch(e){} }

function head(c, opts={}){
  const n = history().length;
  return `<header class="head">
    ${opts.back?`<button class="back" type="button" data-go="back" aria-label="Back">‹</button>`:""}
    <span class="brand">${esc(C.appName)}</span>
    ${opts.hist && n?`<button class="hist" type="button" data-go="history">My reports · ${n}</button>`:""}
    <span class="tag">${txt(c.tag)}</span></header>`;
}
const foot = t => `<footer class="foot">${txt(t)}</footer>`;
const gpsLine = () => {
  if(gpsState==="wait") return `<div class="gps wait"><i></i>Locking GPS…</div>`;
  if(gpsState==="on" && fix) return `<div class="gps on"><i></i>Spot marked · ${fix.lat.toFixed(5)}, ${fix.lon.toFixed(5)} · ±${Math.round(fix.acc)} m</div>`;
  if(gpsState==="off") return `<div class="gps"><i></i>No GPS fix · report will file without a pin</div>`;
  return "";
};
function options(key, multi){
  const sel = picks[key];
  return `<div class="opts" role="${multi?"group":"radiogroup"}">` + lines(S[key].options).map(o=>{
    const on = multi ? sel.includes(o) : sel===o;
    return `<button type="button" class="opt${multi?" multi":""}" data-pick="${esc(key)}" data-val="${esc(o)}" aria-pressed="${on}"><span class="dot"></span><span>${esc(o)}</span></button>`;
  }).join("") + `</div>`;
}

function render(keepScroll){
  const y = keepScroll ? app.querySelector(".body")?.scrollTop : 0;
  let h = "";
  if(screen==="welcome"){
    const c = S.welcome;
    h = head(c,{hist:true}) + `<div class="body center">
      <p class="kicker">${txt(c.kicker)}</p><h1>${txt(c.title)}</h1>
      <button class="panic${gpsState==="wait"?" busy":""}" type="button" data-go="mark">${gpsState==="wait"?"Marking…":txt(c.button)}</button>
      <p class="lead">${txt(c.body)}</p><p class="fine">${txt(c.note)}</p></div>` + foot(c.footer);
  } else if(ORDER.includes(screen)){
    const c = S[screen], step = ORDER.indexOf(screen)+1, multi = !!MULTI[screen];
    const ok = OPTIONAL[screen] || (multi ? picks[screen].length>0 : !!picks[screen]);
    const showBtn = multi || OPTIONAL[screen];
    h = head(c,{back:true}) + `<div class="progress"><b style="width:${step*25}%"></b></div>
      <div class="body">${step===1?gpsLine():""}<h1>${txt(c.title)}</h1>${c.sub?`<p>${txt(c.sub)}</p>`:""}
      ${options(screen, multi)}
      ${screen==="animal"?`<button class="ghost" type="button" data-go="domestic">${txt(c.domestic)}</button>`:""}
      ${showBtn?`<button class="cta" type="button" data-go="next" ${ok?"":"disabled"}>${txt(c.next)}</button>`:""}</div>` + foot(c.footer);
  } else if(screen==="sending"){
    h = head(S.feeling) + `<div class="body center"><div class="gps wait"><i></i>Transmitting report…</div></div>` + foot(S.feeling.footer);
  } else if(screen==="done"){
    const c = S.done, r = history()[0];
    h = head(c) + `<div class="body center"><span class="pill">${txt(c.pill)}</span><h1>${txt(c.title)}</h1><p class="lead">${txt(c.body)}</p>
      ${r?receipt(r):""}
      <button class="cta" type="button" data-go="again" style="margin-top:8px">${txt(c.again)}</button></div>` + foot(c.footer);
  } else if(screen==="domestic"){
    const c = S.domestic;
    h = head(c,{back:true}) + `<div class="body center"><span class="pill">${txt(c.pill)}</span><h1 style="font-size:calc(var(--h)*.85)">${txt(c.title)}</h1><p>${txt(c.body)}</p>
      <button class="cta" type="button" data-go="home" style="margin-top:8px">${txt(c.back)}</button></div>` + foot(c.footer);
  } else if(screen==="history"){
    const hs = history();
    h = `<header class="head"><button class="back" type="button" data-go="home" aria-label="Back">‹</button><span class="brand">${esc(C.appName)}</span><span class="tag">My reports</span></header>
      <div class="body">${hs.length ? `<div class="list">${hs.map(r=>`<div class="item"><strong>${esc(r.animal)}</strong><span class="when">${when(r.t)}</span>
        <span>${esc([].concat(r.condition).join(", "))}</span><span class="id">${esc(r.id)}</span>
        ${r.lat!=null?`<a href="${mapUrl(r)}" target="_blank" rel="noopener">${r.lat.toFixed(4)}, ${r.lon.toFixed(4)} ↗</a>`:`<span class="id">No pin</span>`}</div>`).join("")}</div>`
        : `<p class="empty">No reports yet.</p>`}</div>` + foot(S.welcome.footer);
  }
  app.innerHTML = `<div class="screen" style="display:contents">${h}</div>`;
  const b = app.querySelector(".body"); if(b) b.scrollTop = y || 0;
}
const mapUrl = r => `https://www.google.com/maps?q=${r.lat},${r.lon}`;
const when = t => new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
function receipt(r){
  return `<dl class="receipt">
    <dt>Report</dt><dd>${esc(r.id)}</dd>
    <dt>Animal</dt><dd>${esc(r.animal)}</dd><dt>Condition</dt><dd>${esc([].concat(r.condition).join(", "))}</dd>
    <dt>Sent to</dt><dd>${esc(r.send.join(", "))}</dd>${r.feeling?`<dt>Feeling</dt><dd>${esc(r.feeling)}</dd>`:""}
    <dt>Logged</dt><dd>${when(r.t)}</dd>
    <dt>Spot</dt><dd>${r.lat!=null?`<a href="${mapUrl(r)}" target="_blank" rel="noopener">${r.lat.toFixed(5)}, ${r.lon.toFixed(5)} ↗</a>`:"No GPS fix"}</dd></dl>`;
}

function mark(){
  gpsState = "wait"; render();
  const proceed = () => { screen = "animal"; render(); };
  if(!("geolocation" in navigator)){ gpsState="off"; return setTimeout(proceed, 600); }
  let done = false;
  const finish = () => { if(!done){ done = true; proceed(); } };
  navigator.geolocation.getCurrentPosition(
    p => { fix = {lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy}; gpsState="on"; finish(); },
    () => { gpsState="off"; finish(); },
    {enableHighAccuracy:true, timeout:9000, maximumAge:30000});
  setTimeout(()=>{ if(!done){ gpsState = fix ? "on" : "off"; finish(); } }, 10000);
  try{ navigator.vibrate && navigator.vibrate(30); }catch(e){}
}
function submit(){
  const d = new Date();
  const id = "RK-" + String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0") + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
  keep({id, t:d.toISOString(), animal:picks.animal, condition:picks.condition.slice(), send:picks.send.slice(), feeling:picks.feeling,
        lat:fix?fix.lat:null, lon:fix?fix.lon:null});
  screen = "sending"; render();
  setTimeout(()=>{ screen = "done"; render(); try{ navigator.vibrate && navigator.vibrate([20,60,20]); }catch(e){} }, 1400);
}

let autoT;
function advance(){ const i = ORDER.indexOf(screen); if(i<0) return; if(i===ORDER.length-1) return submit(); screen = ORDER[i+1]; render(); }
app.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const g = b.dataset.go;
  if(g==="mark") return mark();
  if(g==="next") return advance();
  if(g==="back"){ const i = ORDER.indexOf(screen); screen = i>0 ? ORDER[i-1] : (screen==="domestic" ? "animal" : "welcome"); if(screen==="welcome") fresh(); return render(); }
  if(g==="again" || g==="home"){ fresh(); screen = "welcome"; return render(); }
  if(g==="domestic" || g==="history"){ screen = g; return render(); }
  if(b.dataset.pick){
    const k = b.dataset.pick, v = b.dataset.val;
    if(MULTI[k]){ const a = picks[k], i = a.indexOf(v); i<0 ? a.push(v) : a.splice(i,1); return render(true); }
    picks[k] = v; render(true);
    clearTimeout(autoT); autoT = setTimeout(advance, 220);   // single-select: move on as soon as something is picked
  }
});
render();
</script>
</body>
</html>
